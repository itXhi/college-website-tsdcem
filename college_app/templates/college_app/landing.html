<!doctype html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome</title>
  <style>
    :root{
      --landing-bg-start: #0b0630;
      --landing-bg-mid: #1a0838;
      --landing-bg-end: #120727;
      --glow-color-1: rgba(0,156,255,0.18);
      --glow-color-2: rgba(0,156,255,0.10);
    }

    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;background:
      radial-gradient(600px 300px at 50% 35%, rgba(120,48,100,0.28) 0%, transparent 30%),
      linear-gradient(180deg,var(--landing-bg-start) 0%,var(--landing-bg-mid) 40%,var(--landing-bg-end) 100%);
      min-height:100vh;}
    .logo-wrap{display:flex;align-items:center;justify-content:center;position:relative}

    .logo{
      width:640px;height:auto;display:block;cursor:pointer;position:relative;z-index:1000;
      background: transparent; border-radius:0; border: none; object-fit: contain; 
      transition: transform .32s cubic-bezier(.2,.9,.2,1), filter .32s ease, box-shadow .32s ease;
      filter: drop-shadow(0 28px 64px rgba(0,0,0,0.6));
      box-shadow: none !important;
    }
    .logo:hover{ transform: translateY(-8px) scale(1.04); }

    /* disable large pseudo halo so glow follows logo alpha shape only */
    .logo-wrap::before{ display:none; }

    @keyframes logoGlow { 
      0% { filter: drop-shadow(0 22px 48px rgba(0,0,0,0.58)); transform: translateY(0) scale(1); }
      50% { filter: drop-shadow(0 36px 92px rgba(20,10,40,0.6)); transform: translateY(-4px) scale(1.01); }
      100% { filter: drop-shadow(0 22px 48px rgba(0,0,0,0.58)); transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo{ transition: none !important; }
    }

    /* remove focus outlines and any default anchor box shadows */
    .logo-wrap, .logo { outline: none; }
    .logo-wrap:focus { outline: none; box-shadow: none; }

    .hint{position:fixed;bottom:30px;width:100%;text-align:center;color:rgba(255,255,255,0.85);font-family:sans-serif}
  </style>
</head>
<body>
  <div class="landing-overlay" aria-hidden="true"></div>
  <a href="/home/" class="logo-wrap" role="button" aria-label="Enter site" tabindex="0">
    <img src="{% static 'images/logo.png' %}" alt="full logo" class="logo" id="landingLogo">
  </a>
  <script>
    // Brief entrance pulse then continue subtle glow
    document.addEventListener('DOMContentLoaded', function(){
      const logo = document.querySelector('#landingLogo');
      const overlay = document.querySelector('.landing-overlay');
      if(!logo) return;
      // play a short, stronger pulse
      logo.style.animation = 'logoGlow 1.2s ease-in-out 1';
      setTimeout(()=>{ logo.style.animation = 'logoGlow 3.2s ease-in-out infinite'; }, 1200);

      // Click to animate expand then navigate
      const wrapper = document.querySelector('.logo-wrap');
      let busy = false;
      // keyboard accessibility: Enter or Space activates click.
      wrapper.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault(); wrapper.click();
        }
      });

      // hover/intensify effects (for mouse users)
      wrapper.addEventListener('mouseenter', function(){
        // stronger outer glow and modest scale when hovering — use drop-shadow so it follows the logo shape
        logo.style.transition = 'transform 240ms cubic-bezier(.2,.9,.2,1), filter 240ms ease';
        logo.style.transform = 'translateY(-8px) scale(1.06)';
        logo.style.boxShadow = 'none';
        logo.style.filter = 'drop-shadow(0 36px 92px rgba(0,140,200,0.28))';
      });
      wrapper.addEventListener('mouseleave', function(){
        // return to normal animated state (keep no box outline)
        logo.style.transition = 'transform 320ms cubic-bezier(.2,.9,.2,1), filter 320ms ease';
        logo.style.transform = '';
        logo.style.boxShadow = 'none';
        logo.style.filter = 'drop-shadow(0 28px 64px rgba(0,0,0,0.6))';
      });

      wrapper.addEventListener('click', function(ev){
        ev.preventDefault();
        if(busy) return;
        // respects user preference
        if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
          window.location.href = '/home/';
          return;
        }
        busy = true;
        const rect = logo.getBoundingClientRect();
        const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
        const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
        const dx = (vw / 2) - (rect.left + rect.width / 2);
        const dy = (vh / 2) - (rect.top + rect.height / 2);
        const scale = Math.max(vw / rect.width, vh / rect.height) * 1.15;

        // prepare logo for fixed-position transform
        logo.style.position = 'fixed';
        logo.style.left = rect.left + 'px';
        logo.style.top = rect.top + 'px';
        logo.style.width = rect.width + 'px';
        logo.style.height = rect.height + 'px';
        logo.style.margin = 0;
        logo.style.zIndex = 1001;
        logo.style.transition = 'transform 650ms cubic-bezier(.2,.9,.2,1), border-radius 650ms ease, box-shadow 650ms ease, left 650ms ease, top 650ms ease, width 650ms ease, height 650ms ease';

        // fade in overlay
        overlay.style.transition = 'background 600ms ease';
        overlay.style.zIndex = 1000;
        overlay.style.background = 'rgba(3,6,10,0)';

        // force reflow then start transform
        void logo.offsetWidth;
        logo.style.borderRadius = '0px';
        logo.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
        overlay.style.background = 'rgba(2,6,23,0.72)';

        // After transition completes, navigate
        const onEnd = function(){
          logo.removeEventListener('transitionend', onEnd);
          // small delay to allow overlay to settle
          setTimeout(()=> window.location.href = '/home/', 80);
        };
        logo.addEventListener('transitionend', onEnd);
      });
    });
  </script>
</body>
</html>
